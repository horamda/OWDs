<style id="css">
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#14213d;--muted:#5c6475;--line:#ddd6c8;--navy:#0b2545;--gold:#c9920a;--soft:#ece6d9;

:root[data-theme="dark"]{--bg:#0e1420;--panel:#161e2d;--ink:#e9ecf2;--muted:#9aa3b5;--line:#2a3447;--navy:#8fb4ff;--gold:#f0bd3c;--soft:#1d2738;--sun:#1a2232}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:3px solid var(--navy);padding-bottom:14px}
.brand small{display:block;color:var(--muted);font-size:13px}
.brand h1{font-size:clamp(34px,6vw,54px);line-height:.95;color:var(--navy)}
.brand h1 span{color:var(--gold)}
nav.tabs{display:flex;gap:4px;margin:18px 0 20px;flex-wrap:wrap}
nav.tabs button,.seg button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
nav.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1b1400;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.period{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.period input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.seg{display:inline-flex;gap:0}
.seg button{border-radius:0;padding:6px 10px;font-size:13px}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-family:"Barlow Condensed",Arial,sans-serif;font-size:40px;line-height:1}
.kpi span{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{font-size:30px;margin-bottom:6px}
.panel h2.e{color:var(--navy)}.panel h2.a{color:var(--gold)}
.panel h3{font-size:19px;margin:14px 0 6px;color:var(--muted)}
.bar{display:grid;grid-template-columns:minmax(130px,1.4fr) 2fr 48px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.bar .t{display:flex;flex-direction:column}
.bar .t a{font-size:12px;color:var(--muted);text-decoration:none}
.bar .t a:hover{text-decoration:underline}
.track{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.fill{height:100%;border-radius:7px}
.pct{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--muted)}
.total{display:flex;justify-content:flex-end;align-items:baseline;gap:10px;padding-top:8px;font-size:13px;color:var(--muted)}
.total b{font-family:"Barlow Condensed",Arial,sans-serif;font-size:28px;color:var(--ink)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:13px}
.people td,.people th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.people th{font-weight:600;color:var(--muted);font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.cal table{min-width:100%}
.cal th,.cal td{border:1px solid var(--line);padding:0;height:26px}
.cal thead th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:11px;color:var(--muted);min-width:26px;text-align:center}
.cal thead th.today{color:var(--ink);background:var(--gold)}
.cal .c1,.cal .c2,.cal .c3{position:sticky;background:var(--panel);z-index:1;text-align:left;padding:0 8px;white-space:nowrap}
.cal .c1{left:0;min-width:150px;max-width:170px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cal .c2{left:150px;min-width:170px;font-size:12px}
.cal .c3{left:320px;min-width:34px;text-align:center;padding:0}
.cal thead .c1,.cal thead .c2,.cal thead .c3{z-index:3}
.cal td.d{min-width:26px;text-align:center}
.cal td.sun{background:var(--sun)}
.cal td.P{background:var(--P)}.cal td.R{background:var(--R)}.cal td.X{background:var(--X)}.cal td.D{background:var(--D)}
.cal.edit td.d{cursor:pointer}.cal.edit td.d:hover{outline:2px solid var(--gold);outline-offset:-2px}
.cal td.tday{box-shadow:inset 0 0 0 2px var(--gold)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.forms a.f{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-top:8px;text-decoration:none;background:var(--bg)}
.forms a.f:hover{border-color:var(--gold)}
.note{font-size:13px;color:var(--muted);margin-top:14px}

.pcard{display:grid;grid-template-columns:minmax(160px,220px) 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.pcard.off{opacity:.55}
.pcard input.nm{font:inherit;font-weight:600;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}

.chip{font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--bg)}

.addf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.addf input,.addf select{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}

}

function onErr(err){var c=err&&err.code,m;

function load(force){sync={state:'loading',msg:''};render();
 fetch('api/sheet'+(force?'?refresh=1':''),{credentials:'same-origin',cache:'no-store'})
  .then(function(r){return r.json().then(function(j){if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j})})
